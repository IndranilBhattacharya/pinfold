name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck · tests · build · size · published types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Zero known vulnerabilities, dev tooling included. The installed packages are audited by
      # the consumer smoke test.
      - run: npm audit --audit-level=low
      - run: npm run verify

  # COMPATIBILITY.md: every OS × Node × React. The test suite includes the
  # React Compiler suite, so each leg runs compiled and uncompiled consumers.
  matrix:
    name: ${{ matrix.os }} · node ${{ matrix.node }} · react ${{ matrix.react }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
        react: [18, 19]
        # macOS runners are scarce (a few at a time per account): six queued legs timed out
        # waiting for a machine. macOS covers the OS on Node 22; Node versions run on the others.
        exclude:
          - { os: macos-latest, node: 20 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The dev tooling (vitest 5, jsdom 30, tsup 9) needs Node 22+, the published packages
      # do not: on the Node 20 leg, test and build on 22, then run the consumer on 20.
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node == 20 && 22 || matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm i --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: npm test
      - run: npm run build
      - if: matrix.node == 20
        uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: node scripts/consumer-smoke.mjs --pm npm --react ${{ matrix.react }}

  # Early warning for the next React major. Informational: never blocks a merge.
  react-canary:
    name: react canary (informational)
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm i --no-save react@canary react-dom@canary
      - run: npm test

  # The packed tarballs, installed by each package manager (Yarn = Plug'n'Play).
  package-managers:
    name: install · ${{ matrix.pm }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        pm: [pnpm, yarn, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with: { version: 10 }
      - if: matrix.pm == 'yarn'
        run: corepack enable && corepack prepare yarn@stable --activate
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: node scripts/consumer-smoke.mjs --pm ${{ matrix.pm }} --react 19

  # Real apps on the packed tarballs: Next.js (RSC + ISR, Pages Router) and a
  # JS-only webpack production build. The CLI runs init/add twice in each.
  fixtures:
    name: fixture apps (next.js, webpack, cli)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/fixture-apps.mjs --app all --cli

  # Accessibility evidence in a real browser: axe (WCAG 2.2 AA) in light and dark mode,
  # the keyboard map, focus, reduced motion and forced colours. The report is uploaded per run.
  a11y:
    name: accessibility report
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/a11y-report.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: a11y-report, path: a11y-report }

  # Published .d.ts files under node10, node16 and (TS 5+) bundler resolution.
  typescript:
    name: types · typescript ${{ matrix.ts }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        ts: ['4.7.4', '5.0.4', 'latest']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/consumer-smoke.mjs --pm npm --react 18 --ts ${{ matrix.ts }}
