name: Release

# Manual only: a human decides when to publish. D-18.
# Prerequisite: each package has npm trusted publishing configured for this
# repository and workflow (npmjs.com → package → Settings → Trusted publisher).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag: latest for releases, next for pre-release previews (D-22)'
        required: true
        default: latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run verify
      - name: Refuse to publish a runtime dependency
        run: |
          node -e '
            for (const p of ["core", "css", "react"]) {
              const deps = Object.keys(require(`./packages/${p}/package.json`).dependencies ?? {});
              const extra = deps.filter((d) => !d.startsWith("@pinfold/"));
              if (extra.length) { console.error(`@pinfold/${p} has runtime deps: ${extra}`); process.exit(1); }
            }'
      # Installs the packed tarballs into a fresh app and audits what a user would get.
      - run: node scripts/consumer-smoke.mjs --pm npm --react 19
      # Publishes only the versions that are not on npm yet, so a re-run is safe.
      - run: node scripts/publish.mjs --tag ${{ inputs.tag }}
